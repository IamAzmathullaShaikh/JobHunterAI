version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: jobhunter-ai-ecosystem
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AI_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
      - DATABASE_URL=sqlite+aiosqlite:////app/data/jobhunter.db
    volumes:
      - jobhunter-data:/app/data
      - jobhunter-logs:/app/logs
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s

volumes:
  jobhunter-data:
  jobhunter-logs:
